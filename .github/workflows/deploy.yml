name: Tests, push and deploy

# Hasta el 2026-10-18 esto era despliegue continuo a secas, y sin una sola
# prueba: entraba por SSH, hacia `git pull` y compilaba la imagen DENTRO del
# VPS con `docker compose build`. Tres problemas medidos, los mismos que en los
# otros servicios del Hub mas uno propio de este repo:
#
#   - el build dentro del servidor se come la RAM, que es el limite de esta
#     maquina, y tarda minutos;
#   - si el build fallaba, el `git pull` ya se habia hecho, asi que el repo del
#     servidor quedaba en el commit nuevo con el contenedor viejo corriendo;
#   - y lo peor, propio de aqui: el contenedor en produccion corria una imagen
#     SIN ETIQUETA del 10/10, mientras `latest` apuntaba a otra mas vieja.
#     Nadie podia decir que codigo estaba sirviendo. El despliegue por SHA
#     arregla eso en el primer despliegue.
#
# Ahora la imagen se construye aqui, se publica en ghcr.io y el VPS solo se la
# baja, por SHA. Mismo patron que auth-currency-data-hub, currency-data-hub,
# api-gateway-currency-data-hub y pharma_back_py.
#
# No hay ninguna credencial nueva que crear: GITHUB_TOKEN lo genera Actions
# para esta ejecucion y caduca al terminar el job. El VPS ya tiene su
# `docker login ghcr.io` hecho.

on:
  push:
    branches:
      # OJO: aqui la rama que despliega es main. `master` es una rama muerta de
      # abril de 2026 — al contrario que en los otros tres repos del Hub.
      - main
    paths-ignore:
      # Un cambio de documentacion no cambia la imagen: reconstruirla seria
      # gastar minutos de Actions y una version mas en el registro para nada.
      - '**.md'
      - '.idea/**'
      - 'errores/**'
  # Para poder relanzarlo a mano desde la pestana Actions, que es lo comodo
  # cuando lo que falla es el despliegue y no el codigo.
  workflow_dispatch:

env:
  # ghcr.io exige el owner en minusculas, y "ko2javier" ya lo esta.
  IMAGEN: ghcr.io/ko2javier/ko2-kafka-events

jobs:
  # 22 tests, escritos el 2026-10-18 porque este repo no tenia ninguno. Cinco
  # son unitarios (la ventana deslizante de AlertConsumer) y diecisiete
  # levantan un MySQL y un KAFKA de verdad con Testcontainers; el runner
  # ubuntu-latest ya trae Docker, asi que no hay nada que instalar.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Guarda las dependencias entre ejecuciones; sin esto cada push
          # vuelve a bajar Spring entero.
          cache: gradle

      # --no-daemon: en un runner que se destruye al terminar, el demonio de
      # Gradle no se reutiliza nunca y solo deja un proceso colgando.
      - name: Tests
        run: ./gradlew test --no-daemon

      # El informe solo sirve cuando algo falla, pero hay que pedirlo con
      # if: always() porque el paso anterior ya ha puesto el job en rojo.
      - name: Informe de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-de-tests
          path: build/reports/tests/test
          retention-days: 7

  build-and-push:
    # Sin esto, el build correria EN PARALELO con los tests y la imagen se
    # publicaria igual aunque salieran rojos.
    needs: tests
    runs-on: ubuntu-latest

    # packages: write es lo que deja publicar en ghcr.io; contents: read, lo
    # que deja al checkout leer el codigo.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Entrar en el registro de GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar buildx
        # Hace falta para el cache de abajo: el driver "docker" que trae el
        # runner por defecto construye pero no sabe exportar cache, y falla
        # con "Cache export is not supported for the docker driver".
        uses: docker/setup-buildx-action@v3

      - name: Construir la imagen y subirla
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Dos etiquetas para la MISMA imagen:
          #   latest -> el respaldo, por si hay que levantar el servicio a mano
          #   <sha>  -> la que despliega el job de abajo, para saber que codigo
          #             corre y poder volver atras a una version concreta
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}
          # Sin esto, cada push vuelve a bajar Spring entero dentro del build.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Sin esto buildx sube ademas un certificado de procedencia y un
          # indice, y cada construccion aparece como TRES entradas en el
          # registro en vez de una.
          provenance: false

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    # Dos push seguidos no recrean el servicio a la vez: el segundo espera. El
    # grupo es el mismo que usan los otros tres servicios del Hub: comparten
    # docker-compose.yml, y dos `compose up` simultaneos en el mismo proyecto
    # se pisan.
    concurrency:
      group: produccion-hub
      cancel-in-progress: false

    steps:
      - name: Desplegar en el VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          # Sin esto, un comando que falla no detiene el script y el paso puede
          # acabar en verde con el despliegue a medias.
          script_stop: true
          script: |
            set -e
            # El docker-compose.yml de este servicio vive en
            # server-infrastructure, compartido con los otros siete. Este pull
            # trae la version del compose que lee ${KAFKA_EVENTS_TAG}; sin el,
            # un compose viejo ignoraria la etiqueta y seguiria compilando
            # aqui. Ya NO se hace git pull del clon de este repo dentro de
            # portfolio-backend/: el codigo deja de usarse en el servidor.
            cd ~/server-infrastructure
            git pull
            cd portfolio-backend

            # Por el SHA y no por latest: asi el contenedor dice exactamente
            # que codigo corre, y volver atras es repetir este comando con el
            # SHA anterior:
            #     KAFKA_EVENTS_TAG=<sha> docker compose up -d --no-deps ko2-kafka-events
            export KAFKA_EVENTS_TAG=${{ github.sha }}
            docker compose pull ko2-kafka-events
            # --no-deps para no tocar el broker ni los demas servicios, que no
            # son de este repo. OJO: sin --no-deps, compose recrearia tambien
            # kafka, que es de quien depende este servicio.
            docker compose up -d --no-deps ko2-kafka-events

            # Que el contenedor arranque no significa que el servicio responda.
            # El actuator de este servicio NO esta en el puerto de la API: va
            # en el 6001 (management.server.port), que es el que raspa
            # Prometheus. Se espera hasta 60 s a un 200; si no llega, el job
            # sale ROJO con el final del log a la vista en Actions.
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:6001/actuator/health || true)
              if [ "$code" = "200" ]; then
                echo "Desplegado: responde 200 con la imagen $KAFKA_EVENTS_TAG"
                exit 0
              fi
              sleep 2
            done
            echo "ko2-kafka-events no responde 200 en 60 s tras desplegar $KAFKA_EVENTS_TAG"
            docker compose logs --tail 40 ko2-kafka-events
            exit 1
