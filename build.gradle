plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.ko2'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'

    // JPA + MySQL
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JWT (JJWT 0.12.x — misma versión que el resto del ecosistema KO2)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly  'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly  'io.jsonwebtoken:jjwt-jackson:0.12.3'

    // Actuator + Micrometer + Prometheus
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Jackson (serialización Kafka)
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Swagger / OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // Tests de integracion (2026-10-18): un MySQL y un Kafka de verdad en
    // contenedores. Las versiones de Testcontainers las fija el BOM de Spring
    // Boot (1.19.8). Aqui Kafka SI hace falta, al contrario que en auth y en
    // api-service: este servicio es un CONSUMIDOR (dos @KafkaListener), y sin
    // broker lo unico que se podria probar son los endpoints REST.
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.testcontainers:kafka'

    // Cliente HTTP de los tests. Sin esto, TestRestTemplate usa
    // HttpURLConnection del JDK, que NO puede reintentar un POST cuando el
    // servidor contesta 401 o 403 en streaming mode y revienta justo en los
    // tests cuya respuesta correcta es el rechazo. Con Apache HttpClient en el
    // classpath, Spring Boot lo elige solo. La version la fija el BOM.
    testImplementation 'org.apache.httpcomponents.client5:httpclient5'

    // Sin esto los tests NO SE EJECUTAN: Gradle muere con "Failed to load
    // JUnit Platform ... including the JUnit Platform launcher" antes de
    // entrar en ninguna clase. No es un test en rojo, es la bateria entera sin
    // arrancar. Le paso lo mismo a auth-currency-data-hub el 2026-10-18.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

springBoot {
    mainClass = 'com.ko2.events.Ko2KafkaEventsApplication'
}

tasks.named('test') {
    useJUnitPlatform()
}
